      let language = localStorage.getItem('language');
      if (!language && navigator.languages) {
        for (const language of navigator.languages) {
          if (language.indexOf('hu') > -1) {
            window.location = "index_hu.html";
            return;
          } else if (language.indexOf('en') > -1) {
            window.location = "index_en.html";
            return;
          };
        }
      }

      language = localStorage.getItem('language') || window.navigator.userLanguage || window.navigator.language;

      if (language.indexOf('en') > -1) {
        window.location = "index_en.html"
      } else {
        window.location = "index_hu.html"
      };
    })();
  </script>
