<!DOCTYPE html>
<html>

<head>
  <title>Honnan Jöttél</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.3.1/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.3.1/leaflet.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="origin">
  <link rel="stylesheet" href="src/screen.css" />
  <script src="src/points.js" charset="utf-8"></script>
  <script src="src/megye.js" charset="utf-8"></script>
  <script src="src/megye_lakos.js" charset="utf-8"></script>
  <script src="src/regisztralt.js" charset="utf-8"></script>
  <script src="src/szavazokor.js" charset="utf-8"></script>
  <script src="src/szavazokor_2026.js" charset="utf-8"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/github-fork-ribbon-css/0.2.2/gh-fork-ribbon.min.css" />

  <meta property="og:image" content="https://sztupy.hu/honnanjottel/img/preview.png" />
  <meta property="og:site_name" content="sztupy.hu" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Emigration map" />
  <meta property="og:url" content="https://sztupy.hu/honnajottel" />
  <meta property="og:description" content="Hungarian emigration map based on election statistics" />
</head>

<body>
  <script src="https://sztupy.hu/assets/js/logo.js"></script>
  <div id="map"></div>
  <div id="hun"></div>
  <div id="county"></div>
  <div id="data"></div>
  <div id="year">
    <button id="year_2018">2018</button>
    <button id="year_2022">2022</button>
    <button id="year_2026" class="selected">2026</button>
  </div>
  <div id="type">Egyéni</div>
  <a class="github-fork-ribbon" href="https://github.com/sztupy/honnanjottel" data-ribbon="Info / GitHub"
    title="Info / GitHub">Info / GitHub</a>
  <script type="text/javascript">
    let currentCity = '';
    let countyCalculationType = 'total';
    let tiles = L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors, Points &copy 2012 LINZ'
    }),
      latlng = L.latLng(30, 0);

    let tiles2 = L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors, Points &copy 2012 LINZ'
    }),
      latlng2 = L.latLng(47.19801, 19.3);

    let tiles3 = L.tileLayer('http://{s}.tile.osm.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="http://osm.org/copyright">OpenStreetMap</a> contributors, Points &copy 2012 LINZ'
    }),
      latlng3 = L.latLng(47.19801, 19.3);

    let map = L.map('map', { center: latlng, zoom: 3, layers: [tiles] });
    let hun = L.map('hun', { center: latlng2, zoom: 7, layers: [tiles2] });
    let county = L.map('county', { center: latlng3, zoom: 7, layers: [tiles3] });
    let hunLayer;
    let countyLayer;
    let currentYear = "2026";

    function loadMarkers() {
      LOCATIONS.forEach(function (point) {
        let loc = point.location;
        let marker = L.marker(L.latLng(loc.lat, loc.lng), { title: point.hu + "\n" + point.en });
        marker.on('click', function () {
          currentCity = point.city;
          document.getElementById('data').innerHTML = 'Kiválasztott város: ' + point.city;
          loadKor(point.city);
        });
        marker.addTo(map)
      });
    }

    function handler(type, foreign_city) {
      let max = 0;
      let count = 0;
      let countCounty = {}
      REGISZTRALTAK[currentYear].forEach(function (r) {
        let r_county = r[0];
        let r_city = r[2];
        let r_count = r[3];
        if (r_city == foreign_city) {
          if (r_count > max) {
            max = r_count;
          }
          count += r_count;
          countCounty[r_county] = countCounty[r_county] || 0;
          countCounty[r_county] += r_count;
        }
      });

      if (countyCalculationType == 'avg') {
        for (let l in countCounty) {
          countCounty[l] = countCounty[l] * MEGYE_LAKOSOK_FIX[l];
        }
      }
      let maxCounty = Math.max(...Object.values(countCounty));

      return function (feature, layer) {
        for (let i = 0; i < REGISZTRALTAK[currentYear].length; i++) {
          let r = REGISZTRALTAK[currentYear][i];

          let r_county = r[0];
          let r_code = r[1];
          let r_city = r[2];
          let r_count = r[3];

          if (r_city == foreign_city) {
            if (r_county == +feature.properties.MEGY_KOD && r_code == +feature.properties.OEVK_STR) {
              percentage = (r_count * 1.0 / max);
              if (type == 'color') {
                value = 60 - Math.round(percentage * 60);
                color = 'hsl(' + value + ',100%,50%)'
                return { color: '#000', fillColor: color, opacity: 0.25, fillOpacity: 0.75, weight: 1 };
              };
              if (type == 'click') {
                layer.bindPopup('<b>' + feature.properties.OEVK_NAME +
                  '</b><br/>Szavazók: ' + r_count + ' (' + ((r_count / count) * 100).toFixed(3) + '%)');
                return;
              }
            }
            if (r_county == +feature.properties.MEGY_KOD && feature.properties.OEVK_ID == null) {
              percentage = (countCounty[r_county] * 1.0 / maxCounty);
              if (type == 'color') {
                value = 60 - Math.round(percentage * 60);
                color = 'hsl(' + value + ',100%,50%)';
                return { color: '#000', fillColor: color, opacity: 0.25, fillOpacity: 0.75, weight: 1 };
              }
              if (type == 'click') {
                layer.bindPopup('<b>' + feature.properties.MEGY_NEV +
                  '</b><br/>Szavazók: ' + countCounty[r_county] + ' (' + ((countCounty[r_county] / count) * 100).toFixed(3) + '%)');
                return;
              }
            }
          }
        }
        if (type == 'click') {
          layer.bindPopup('<b>' + (feature.properties.OEVK_ID == null ? feature.properties.MEGY_NEV : feature.properties.OEVK_NAME) +
            '</b><br/>Szavazók: 0 (0%)');
        }
        return { color: '#000', fillColor: 'hsl(180,100%,50%)', opacity: 0.25, fillOpacity: 0.25, weight: 1 };
      }
    }

    function loadKor(foreign_city) {
      if (hunLayer) {
        hun.removeLayer(hunLayer);
      }
      hunLayer = L.geoJSON(currentYear == "2026" ? SZAVAZOKOR26 : SZAVAZOKOR, { style: handler('color', foreign_city), onEachFeature: handler('click', foreign_city) });
      hunLayer.addTo(hun);

      if (countyLayer) {
        county.removeLayer(countyLayer);
      }
      countyLayer = L.geoJSON(MEGYE, { style: handler('color', foreign_city), onEachFeature: handler('click', foreign_city) });
      countyLayer.addTo(county);
    }

    function fillNationalData() {
      for (let year in REGISZTRALTAK) {
        let result = {};
        for (let i = 0; i < REGISZTRALTAK[year].length; i++) {
          let r = REGISZTRALTAK[year][i];

          let r_county = r[0];
          let r_code = r[1];
          let r_count = r[3];

          result[r_county] = result[r_county] || {};
          result[r_county][r_code] = result[r_county][r_code] || [r_county, r_code, '', 0];
          result[r_county][r_code][3] += r_count;
        }

        for (let m in result) {
          for (let n in result[m]) {
            REGISZTRALTAK[year].push(result[m][n]);
          }
        }
      }
    }

    fillNationalData();
    loadMarkers();
    document.getElementById('year_2018').onclick = function () {
      currentYear = '2018';
      loadKor(currentCity);
      document.getElementById('year_2018').classList.add("selected");
      document.getElementById('year_2022').classList.remove("selected");
      document.getElementById('year_2026').classList.remove("selected");
    };
    document.getElementById('year_2022').onclick = function () {
      currentYear = '2022';
      loadKor(currentCity);
      document.getElementById('year_2018').classList.remove("selected");
      document.getElementById('year_2022').classList.add("selected");
      document.getElementById('year_2026').classList.remove("selected");
    };
    document.getElementById('year_2026').onclick = function () {
      currentYear = '2026';
      loadKor(currentCity);
      document.getElementById('year_2018').classList.remove("selected");
      document.getElementById('year_2022').classList.remove("selected");
      document.getElementById('year_2026').classList.add("selected");
    };
    document.getElementById('data').onclick = function () {
      currentCity = '';
      loadKor(currentCity);
      document.getElementById('data').innerHTML = 'Nemzetközi emigrációs térkép';
    };
    document.getElementById('type').onclick = function () {
      countyCalculationType = (countyCalculationType == 'total') ? 'avg' : 'total';
      document.getElementById('type').innerHTML = countyCalculationType == 'total' ? 'Egyéni' : 'Lakosságarányos';
      loadKor(currentCity);
    };
    document.getElementById('data').onclick();
  </script>

  <script>
    (function (i, s, o, g, r, a, m) {
      i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
        (i[r].q = i[r].q || []).push(arguments)
      }, i[r].l = 1 * new Date(); a = s.createElement(o),
        m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
    })(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');

    ga('create', 'UA-9404141-8', 'auto');
    ga('send', 'pageview');
  </script>
</body>

</html>
